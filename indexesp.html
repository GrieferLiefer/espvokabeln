<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vokabeltrainer Spanisch</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--fg:#4b4b4b;--mut:#8a8a8a;--line:#e5e5e5;--g:#58cc02;--gd:#58a700;--b:#1cb0f6;--bd:#1899d6;--r:#ff4b4b;--rd:#ea2b2b;--gl:#d7ffb8;--gt:#58a700;--rl:#ffdfe0;--rt:#ea2b2b;--sel:#ddf4ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

:root[data-theme="dark"]{--bg:#131f24;--fg:#e4edf2;--mut:#8ea1ad;--line:#37464f;--gl:#1f3a1a;--gt:#89e219;--rl:#3d2024;--rt:#ff7878;--sel:#1d3340;color-scheme:dark}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:700 16px/1.4 Nunito,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
#app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:0 16px}
h1{font-size:26px;font-weight:900;margin:22px 0 4px;color:var(--g)}
h2{font-size:15px;font-weight:800;color:var(--mut);margin:26px 0 8px}
.sub{color:var(--mut);margin:0 0 14px;font-size:14px}
.btn{display:block;width:100%;padding:13px 16px;border:2px solid var(--gd);border-bottom-width:4px;border-radius:16px;background:var(--g);color:#fff;font:900 15px Nunito,sans-serif;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
.btn:active{border-bottom-width:2px;transform:translateY(2px)}
.btn.ghost{background:var(--bg);color:var(--b);border-color:var(--line)}
.btn.bad{background:var(--r);border-color:var(--rd)}
.btn:disabled{background:var(--line);border-color:var(--line);color:var(--mut);cursor:default}
.seg{display:flex;gap:8px;margin-bottom:10px}
.seg button{flex:1;padding:10px 6px;border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;background:var(--bg);color:var(--fg);font:800 14px Nunito,sans-serif;cursor:pointer}
.seg button.on{border-color:var(--b);background:var(--sel);color:var(--b)}
.deck{display:flex;align-items:center;gap:12px;width:100%;margin:0 0 10px;padding:12px 14px;border:2px solid var(--line);border-bottom-width:4px;border-radius:16px;background:var(--bg);color:var(--fg);text-align:left;font:inherit;cursor:pointer}
.deck:active{border-bottom-width:2px;transform:translateY(2px)}
.deck .t{flex:1;min-width:0}.deck b{display:block;font-weight:900}
.deck small{color:var(--mut);font-weight:700}
.bar{height:10px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--g);border-radius:6px}
.due{min-width:30px;text-align:center;padding:4px 9px;border-radius:12px;background:var(--b);color:#fff;font-weight:900;font-size:14px}
.due.z{background:var(--line);color:var(--mut)}
.top{display:flex;align-items:center;gap:14px;padding:18px 0 8px}
.x{border:0;background:none;color:var(--mut);font:900 26px Nunito,sans-serif;cursor:pointer;padding:0 4px}
.top .bar{flex:1;height:16px;margin:0}
.q{flex:1;padding:22px 0}
.q p{margin:0 0 6px;color:var(--mut);font-weight:800;font-size:15px}
.q h3{margin:0 0 22px;font-size:28px;font-weight:900;line-height:1.2;overflow-wrap:anywhere}
.opt{display:block;width:100%;margin:0 0 10px;padding:14px 16px;border:2px solid var(--line);border-bottom-width:4px;border-radius:16px;background:var(--bg);color:var(--fg);text-align:left;font:800 17px Nunito,sans-serif;cursor:pointer}
.opt.sel{border-color:var(--b);background:var(--sel)}
.opt.ok{border-color:var(--g);background:var(--gl);color:var(--gt)}
.opt.no{border-color:var(--r);background:var(--rl);color:var(--rt)}
input.in{width:100%;box-sizing:border-box;padding:14px 16px;border:2px solid var(--line);border-radius:16px;background:var(--bg);color:var(--fg);font:800 18px Nunito,sans-serif;outline:none}
input.in:focus{border-color:var(--b)}
.acc{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.acc button{width:40px;padding:8px 0;border:2px solid var(--line);border-bottom-width:3px;border-radius:10px;background:var(--bg);color:var(--fg);font:800 16px Nunito,sans-serif;cursor:pointer}
.fb{margin:0 -16px;padding:16px 16px 18px}
.fb.ok{background:var(--gl);color:var(--gt)}.fb.no{background:var(--rl);color:var(--rt)}
.fb h4{margin:0 0 4px;font-size:20px;font-weight:900}.fb div{margin-bottom:12px;font-weight:700}
.end{flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center;gap:10px}
.end .big{font-size:56px;font-weight:900;color:var(--g)}
.end .btn{margin-top:6px}
.foot{margin:28px 0 20px;text-align:center}
.foot button{border:0;background:none;color:var(--mut);font:800 13px Nunito,sans-serif;cursor:pointer;text-decoration:underline}
@media (prefers-reduced-motion:no-preference){.fb{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.4}}}
button:focus-visible,input:focus-visible{outline:3px solid var(--b);outline-offset:2px}

  $.innerHTML=h;
}
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/ß/g,'ss').replace(/[¿¡?!.…,;:()"’']/g,' ').replace(/\s+/g,' ').trim();
function accepted(c,r){
  if(r==='de2es'){const e=c[0].replace(/\(([^)]*)\)/g,' ');const n=norm(e),a=n.replace(/^(el\/la|el|la|los|las|un|una)\s+/,'');return [n,a,norm(c[0])]}
  const s=c[1].replace(/^hier:\s*/,'').split(/[,;\/]/).map(x=>norm(x.replace(/\([^)]*\)/g,''))).filter(Boolean);return s.concat(norm(c[1]))
}
let Q=null;
function start(decks,force){
  let it=items(decks,10);
  if(!it.length&&force){const all=[];decks.forEach(d=>d.cards.forEach((c,i)=>dirs().forEach(r=>all.push({d,i,r}))));it=all.sort(()=>Math.random()-.5).slice(0,10)}
  if(!it.length)return home();
  Q={q:it,n:it.length,done:0,ok:0,wrong:0,decks,force};ask();
}
function opts(it){
  const c=it.d.cards[it.i],ai=it.r==='de2es'?0:1,ans=c[ai],pool=[];
  const src=it.d.cards.length>=6?it.d.cards:DECKS.flatMap(d=>d.cards);
  src.forEach(x=>{if(x[ai]!==ans&&x[ai].length<60)pool.push(x[ai])});
  const o=[ans];while(o.length<4&&pool.length){const k=Math.floor(Math.random()*pool.length);const v=pool.splice(k,1)[0];if(!o.includes(v))o.push(v)}
  return o.sort(()=>Math.random()-.5);
}
function ask(){
  const it=Q.q[0];if(!it)return end();
  const c=it.d.cards[it.i],qi=it.r==='de2es'?1:0,lang=it.r==='de2es'?'Wie heißt das auf Spanisch?':'Was bedeutet das auf Deutsch?';
  Q.cur={it,sel:null,checked:false,o:S.mode==='mc'?opts(it):null};
  const pct=Math.round(Q.done/Q.n*100);
  $.innerHTML=`<div class="top"><button class="x" data-quit="1" aria-label="Beenden">✕</button><div class="bar"><i style="width:${pct}%"></i></div></div>
  <div class="q"><p>${lang}</p><h3>${esc(c[qi])}</h3>${Q.cur.o?Q.cur.o.map((t,i)=>`<button class="opt" data-o="${i}">${esc(t)}</button>`).join(''):`<input class="in" id="in" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${it.r==='de2es'?'Spanisch':'Deutsch'} eingeben …"><div class="acc">${'áéíóúñü¿¡'.split('').map(ch=>`<button data-ch="${ch}">${ch}</button>`).join('')}</div>`}</div>
  <div id="bot" style="padding-bottom:18px"><button class="btn" id="go" data-check="1" ${Q.cur.o?'disabled':''}>Prüfen</button></div>`;
  const inp=document.getElementById('in');if(inp){inp.focus();inp.addEventListener('input',()=>{document.getElementById('go').disabled=!inp.value.trim()});inp.addEventListener('keydown',e=>{if(e.key==='Enter')act()})}
}
function check(){
  const k=Q.cur;if(k.checked)return;const it=k.it,c=it.d.cards[it.i],ai=it.r==='de2es'?0:1;let ok;
  if(k.o)ok=k.o[k.sel]===c[ai];else ok=accepted(c,it.r).includes(norm(document.getElementById('in').value));
  k.checked=true;const key=pk(it.d,it.i,it.r),p=P[key]||{b:0,d:0};
  if(ok){p.b=Math.min(p.b+1,5);p.d=Date.now()+IV[p.b]*DAY;if(!k.retry){Q.ok++}Q.done++;Q.q.shift()}
  else{p.b=0;p.d=Date.now()+6e5;Q.wrong++;Q.q.shift();Q.q.push({...it,retry:1})}
  if(ok&&it.retry)Q.done=Math.min(Q.done,Q.n);
  P[key]=p;save();
  if(k.o)document.querySelectorAll('.opt').forEach((b,i)=>{b.disabled=true;if(k.o[i]===c[ai])b.classList.add('ok');else if(i===k.sel)b.classList.add('no')});
  const inp=document.getElementById('in');if(inp)inp.readOnly=true;
  document.getElementById('bot').innerHTML=`<div class="fb ${ok?'ok':'no'}"><h4>${ok?'Richtig!':'Leider falsch'}</h4><div>${ok?esc(c[ai]):'Richtig: '+esc(c[ai])}</div><button class="btn ${ok?'':'bad'}" data-next="1" id="go">Weiter</button></div>`;
  document.getElementById('go').focus();
}
function act(){const b=document.getElementById('go');if(!b||b.disabled)return;if(b.dataset.check)check();else if(b.dataset.next)ask()}
function end(){
  const tot=Q.ok+Q.wrong,pc=tot?Math.round(Q.ok/tot*100):0,d=Q.decks,more=items(d,1).length;
  $.innerHTML=`<div class="end"><div class="big">${pc}%</div><h2 style="margin:0;color:var(--fg);font-size:22px">Runde geschafft</h2><p class="sub">${Q.ok} richtig beim ersten Versuch · ${Q.wrong} Fehler</p>
  ${more?'<button class="btn" data-again="1">Noch eine Runde</button>':''}<button class="btn ghost" data-home="1">Zur Übersicht</button></div>`;
}
document.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;const D=t.dataset;
  if(D.dir){S.dir=D.dir;save();home()}else if(D.mode){S.mode=D.mode;save();home()}
  else if(D.all)start(DECKS);
  else if(D.deck){const d=DECKS.find(x=>x.id===D.deck);Q={decks:[d]};start([d],true)}
  else if(D.o!==undefined&&Q.cur&&!Q.cur.checked){Q.cur.sel=+D.o;document.querySelectorAll('.opt').forEach((b,i)=>b.classList.toggle('sel',i===+D.o));document.getElementById('go').disabled=false}
  else if(D.check||D.next)act();
  else if(D.ch){const i=document.getElementById('in');if(i&&!i.readOnly){i.value+=D.ch;i.focus();document.getElementById('go').disabled=false}}
  else if(D.quit||D.home)home();
  else if(D.again)start(Q.decks,true);
  else if(D.reset){if(t.dataset.sure){P={};save();home()}else{t.dataset.sure=1;t.textContent='Wirklich alles löschen? Nochmal tippen'}}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&Q&&Q.cur&&!document.getElementById('in')&&document.getElementById('go'))act()});
home();
</script></body></html>
